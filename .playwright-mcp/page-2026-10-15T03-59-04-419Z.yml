          - paragraph [ref=f1e1537]: Gain Staging คือการตั้งระดับเสียงให้เหมาะสมทุกจุดที่เสียงผ่าน ตั้งแต่ clip gain ของไฟล์เสียง ปุ่ม input ของปลั๊กอิน ไปจนถึง fader แต่ละชั้น หลักคือไม่มีจุดใด clip (ไฟแดง) และปลั๊กอิน analog-modelled ได้รับ input ไม่แรงเกินจนเพี้ยน วิธีง่ายคือเปิดไฟล์เสียงให้ peak ราว −12 ถึง −18 dBFS (จุดเริ่มต้น) ก่อนเข้า insert ใดๆ แล้วค่อยดัน fader ทีหลัง
