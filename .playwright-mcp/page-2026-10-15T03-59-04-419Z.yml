            - heading "Static Mix เริ่มจากอะไรก่อน" [level=2] [ref=f1e1568]
          - paragraph [ref=f1e1570]: ลำดับทำ static mix ที่แนะนำคือ เริ่มจากชิ้นสำคัญสุดของเพลง (มักคือร้องกับกลอง) ดันให้ชัดก่อน แล้วค่อยเติมเบส เครื่องประกอบ และเอฟเฟกต์ทีหลัง ทำทีละชิ้นเทียบกับของที่เปิดอยู่แล้ว ไม่ใช่ดันทุกอย่างพร้อมกัน เป้าหมายคือฟังรู้ทุกชิ้นโดย master peak ยังอยู่ราว −6 dBFS (จุดเริ่มต้น) ถ้าดังเกินให้ลดทุกอย่างลงพร้อมกัน ไม่ใช่ดึง master ลง
          - generic [ref=f1e1571]:
            - heading "ขั้นตอน static mix" [level=4] [ref=f1e1572]
            - list [ref=f1e1573]:
              - listitem [ref=f1e1574]: ปิดเอฟเฟกต์ทั้งหมดชั่วคราว เหลือแค่ volume + pan
              - listitem [ref=f1e1575]: เปิดร้อง + kick + snare + bass ทำ 4 ชิ้นนี้ให้ชัดก่อน
              - listitem [ref=f1e1576]: เติมเครื่องอื่นทีละชิ้น วาง pan ไปพร้อมกัน
              - listitem [ref=f1e1577]: เช็ก master peak ท่อนดังสุดให้อยู่ราว −6 dBFS (จุดเริ่มต้น)
          - paragraph [ref=f1e1579]: Pan คือการวางเสียงในแนวนอนซ้ายขวา วิธีเริ่มต้นแบบ LCR (left-center-right) คือวางชิ้นหลักอย่าง kick, snare, bass และ lead vocal ไว้กลาง (center) แล้วผลักเครื่องประกอบไปซ้ายสุดหรือขวาสุด เช่น กีตาร์ L กีตาร์ R คีย์บอร์ดข้างหนึ่ง เพอร์คัชชันอีกข้าง วิธีนี้ทำให้ mix กว้างและโล่งเร็วโดยไม่ต้องใช้เอฟเฟกต์ widening ใดๆ
          - generic [ref=f1e1581]:
            - strong [ref=f1e1582]: "🔁 ก่อน–หลัง: ทุกอย่างอยู่กลาง vs วาง pan"
            - paragraph [ref=f1e1583]: "ก่อน: ทุกแทร็ก pan กลางหมด เสียงกองทับกัน ต้องดัน volume แข่งกันจน master ชน 0 ผลคือฟังอึดอัดและร้องจม หลัง: kick/snare/bass/vocal กลาง เครื่องประกอบแยกซ้ายขวา แต่ละชิ้นได้ยินชัดด้วย volume ที่เบาลง master เหลือ headroom เพลงเปิดและกว้างขึ้นทันทีโดยยังไม่แตะ EQ"
