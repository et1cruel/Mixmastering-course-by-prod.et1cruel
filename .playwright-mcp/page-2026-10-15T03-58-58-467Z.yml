            - heading "Production vs Mixing vs Mastering คืออะไร" [level=2] [ref=f1e512]
          - paragraph [ref=f1e514]: Production คือการสร้างดนตรี ได้แก่การแต่ง ทำนอง เลือกเสียง อัดร้อง และเรียบเรียง (arrangement) ผลลัพธ์คือไอเดียเพลงที่สมบูรณ์ ส่วน Mixing คือการนำทุกแทร็กมาปรับสมดุลด้วย volume, pan, EQ, compression, reverb และ automation ให้ทุกชิ้นอยู่ด้วยกันได้ ส่วน Mastering คือการ polish ไฟล์สเตอริโอสุดท้ายให้ดังสม่ำเสมอ ฟังดีทุกอุปกรณ์ และพร้อมปล่อย
          - generic [ref=f1e515]:
            - heading [level=4]
            - list [ref=f1e516]:
              - listitem [ref=f1e517]: Production — คำถามคือ "เพลงนี้ควรเป็นอย่างไร" เน้นไอเดียและการอัดที่ดี
              - listitem [ref=f1e518]: Mixing — คำถามคือ "ทุกเสียงอยู่ด้วยกันอย่างไร" เน้นสมดุล ความชัด และมิติ
              - listitem [ref=f1e519]: Mastering — คำถามคือ "พร้อมปล่อยหรือยัง" เน้น loudness, เสียงรวม และ format ส่งออก
