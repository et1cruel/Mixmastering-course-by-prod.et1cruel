            - paragraph [ref=f1e559]: "Mastering ไม่สามารถซ่อม mix ที่พังได้ ถ้าเสียงร้องจม กีตาร์บวม หรือ master bus ถูกบีบจนแตก การ master ต่อมีแต่จะยิ่งขยายปัญหา กฎเหล็กคือแก้ปัญหาให้ถูกด่าน: ปัญหา arrangement แก้ที่ production ปัญหาสมดุลแก้ที่ mix อย่าหวังให้ mastering มาช่วยชีวิต"
