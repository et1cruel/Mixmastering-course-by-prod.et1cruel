              - listitem [ref=f1e553]: เลือก kick ใน Channel Rack ดูว่า route ไป mixer track หมายเลขใด
              - listitem [ref=f1e554]: ตามดู insert slots, fader, แล้วดูว่า track นั้นส่งต่อไป bus หรือ Master โดยตรง
              - listitem [ref=f1e555]: Mute ทีละ bus แล้วฟังว่าเสียงใดหายไปเพื่อยืนยันเส้นทาง
          - generic [ref=f1e557]:
