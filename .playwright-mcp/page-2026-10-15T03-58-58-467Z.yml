          - 'heading "Signal Flow: เสียงเดินทางอย่างไร" [level=2] [ref=f1e541]'
          - paragraph [ref=f1e543]: Signal Flow คือเส้นทางการเดินทางของเสียงจากต้นกำเนิด (source) ผ่าน processing ต่างๆ ไปยังลำโพง ตัวอย่างพื้นฐานคือ ไมค์หรือ VST → channel fader → insert effects → mixer track → bus/group → master bus → audio interface → monitor ความเข้าใจ flow นี้ช่วยให้ตามหาปัญหาได้เร็วว่าเสียงหายหรือเพี้ยนที่จุดไหน
          - generic [ref=f1e545]:
            - generic [ref=f1e546]: ภาพจำลองเพื่อการเรียนรู้
            - strong [ref=f1e547]: 🖥️
            - paragraph [ref=f1e548]: ใน FL Studio 25 ให้เปิด Mixer ด้วยปุ่ม F9 แต่ละ Channel Rack เชื่อมไปยัง mixer track หนึ่งหมายเลข เสียงไหลจาก Channel → Insert slots (บนลงล่าง) → fader/pan → Bus → Master ลองกดเลือกแทร็กแล้วดูไฟ meter ว่า signal วิ่งไปถึง Master หรือไม่
          - generic [ref=f1e549]:
