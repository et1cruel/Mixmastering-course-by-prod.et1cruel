          - paragraph [ref=e2261]: ลำดับทำ static mix ที่แนะนำคือ เริ่มจากชิ้นสำคัญสุดของเพลง (มักคือร้องกับกลอง) ดันให้ชัดก่อน แล้วค่อยเติมเบส เครื่องประกอบ และเอฟเฟกต์ทีหลัง ทำทีละชิ้นเทียบกับของที่เปิดอยู่แล้ว ไม่ใช่ดันทุกอย่างพร้อมกัน เป้าหมายคือฟังรู้ทุกชิ้นโดย master peak ยังอยู่ราว −6 dBFS (จุดเริ่มต้น) ถ้าดังเกินให้ลดทุกอย่างลงพร้อมกัน ไม่ใช่ดึง master ลง
          - generic [ref=e2262]:
            - heading "ขั้นตอน static mix" [level=4] [ref=e2263]
            - list [ref=e2264]:
              - listitem [ref=e2265]: ปิดเอฟเฟกต์ทั้งหมดชั่วคราว เหลือแค่ volume + pan
              - listitem [ref=e2266]: เปิดร้อง + kick + snare + bass ทำ 4 ชิ้นนี้ให้ชัดก่อน
              - listitem [ref=e2267]: เติมเครื่องอื่นทีละชิ้น วาง pan ไปพร้อมกัน
              - listitem [ref=e2268]: เช็ก master peak ท่อนดังสุดให้อยู่ราว −6 dBFS (จุดเริ่มต้น)
          - paragraph [ref=e2270]: Pan คือการวางเสียงในแนวนอนซ้ายขวา วิธีเริ่มต้นแบบ LCR (left-center-right) คือวางชิ้นหลักอย่าง kick, snare, bass และ lead vocal ไว้กลาง (center) แล้วผลักเครื่องประกอบไปซ้ายสุดหรือขวาสุด เช่น กีตาร์ L กีตาร์ R คีย์บอร์ดข้างหนึ่ง เพอร์คัชชันอีกข้าง วิธีนี้ทำให้ mix กว้างและโล่งเร็วโดยไม่ต้องใช้เอฟเฟกต์ widening ใดๆ
