            - listitem [ref=f1e3930]: จัดวางซ้าย-ขวาด้วย Pan และ stereo widening ได้อย่างมีแผน
            - listitem [ref=f1e3931]: อธิบายและใช้ Haas effect ได้โดยรู้ความเสี่ยงเฟส
            - listitem [ref=f1e3932]: เช็ก Mono compatibility ได้และแก้เมื่อเสียงหาย
