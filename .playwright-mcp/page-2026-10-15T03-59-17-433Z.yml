            - heading "กว้างแต่ต้องไม่พังในลำโพงมือถือ" [level=3] [ref=f1e3935]
            - paragraph [ref=f1e3936]: "เพลงที่ฟังในหูฟังกว้างสะใจ แต่เปิดลำโพงบลูทูธตัวเดียวแล้วกีตาร์หาย เบสหาย นั่นคือปัญหาเฟส/โมโน บทนี้สอนให้กว้างอย่างปลอดภัย: pan, Haas, widening และวิธีเช็กโมโนที่โปรทุกคนต้องทำ"
