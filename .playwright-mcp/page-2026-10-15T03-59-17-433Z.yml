            - list [ref=f1e4038]:
              - listitem [ref=f1e4039]: ใส่ Fruity Stereo Enhancer หรือปลั๊กอิน mono ที่ Master (หรือใช้ปุ่ม mono ของ audio interface)
              - listitem [ref=f1e4040]: "กด mono แล้วฟัง: ร้อง คิก สแนร์ เบส ต้องยังชัดอยู่ระดับใกล้เดิม"
              - listitem [ref=f1e4041]: ถ้ากีตาร์/ซินธ์หายหรือกลวง = เฟสมีปัญหา ให้ลด widening, ลด Haas time, หรือลด side level
              - listitem [ref=f1e4042]: "เช็ก 3 จุด: ท่อนเวิร์ส ฮุก และท่อนที่ใช้เอฟเฟกต์หนักสุด"
              - listitem [ref=f1e4043]: ปลด mono กลับเป็นสเตอริโอทุกครั้งก่อน export (อย่า export ตอนลืมเปิด mono ค้าง!)
          - 'heading "Automation: มิติที่ขยับได้" [level=2] [ref=f1e4045]'
          - paragraph [ref=f1e4047]: "เพลงดีๆ มิติไม่คงที่ทั้งเพลง เวิร์สร้องแห้งใกล้ ฮุกเปิดกว้าง ท้ายท่อนหางยาวโผล่ วิธีทำคือ automation: วาดเส้น Send level, Reverb mix, Delay feedback, Stereo separation ให้ขยับตามท่อน เริ่มง่ายๆ แค่ automate send ร้อง (เวิร์สน้อย ฮุกมาก) เพลงก็มีชีวิตขึ้นเยอะ"
