            - heading "Pan คือเครื่องมือกว้างอันดับหนึ่ง" [level=2] [ref=f1e3993]
          - paragraph [ref=f1e3995]: "ก่อนแตะปลั๊กอิน widening ใดๆ ให้ pan ก่อน กฎ LCR ง่ายๆ: พระเอก (ร้อง คิก สแนร์ เบส) ไว้กลาง เครื่องประกอบ pan ซ้าย-ขวาสมมาตร (กีตาร์ L35/R35, คอรัส L50/R50) เอฟเฟกต์กว้างสุด แค่ pan ดีๆ เพลงก็กว้างแล้วโดยไม่มีปัญหาเฟสเลย"
          - 'heading "Haas Effect: กว้างจากดีเลย์สั้นข้างเดียว" [level=2] [ref=f1e3997]'
          - paragraph [ref=f1e3999]: "Haas คือการดีเลย์ข้างหนึ่ง 10-35ms สมองจะรู้สึกว่าเสียงกว้างขึ้นโดยยัง定位อยู่ข้างที่ไม่ดีเลย์ วิธีทำ: ก๊อปแทร็กโมโน pan ซ้าย-ขวาสุด ดีเลย์ข้างหนึ่ง 15-25ms ฟังดูกว้างขึ้นทันที แต่ความเสี่ยงคือเมื่อรวมเป็นโมโนอาจเกิด comb filtering (เสียงกลวง/บางส่วนหาย) จึงต้องเช็กโมโนทุกครั้ง"
          - generic [ref=f1e4001]:
