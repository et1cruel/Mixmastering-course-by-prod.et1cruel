          - 'heading "3. Level-matched Before/After: วิธีเทียบเสียงไม่ให้โดนหลอก" [level=2] [ref=f1e2404]'
          - paragraph [ref=f1e2406]: กับดักใหญ่ที่สุดของการทำ EQ คือเสียงที่ดังกว่าจะฟังดูดีกว่าเสมอ ไม่ว่าจะ EQ ดีหรือไม่ดี ดังนั้นทุกครั้งที่ Bypass เทียบ ต้องปรับความดังให้เท่ากันก่อน วิธีง่ายคือดูมิเตอร์ LUFS หรือใช้หูปรับ Output Gain ของ EQ ให้ตอนเปิดกับตอน Bypass ดังพอๆ กัน แล้วค่อยตัดสินว่าโทนดีขึ้นจริงหรือไม่
