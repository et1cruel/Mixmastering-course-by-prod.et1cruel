            - heading "เมื่อ EQ ธรรมดาแก้ไม่ได้" [level=3] [ref=f1e2371]
            - paragraph [ref=f1e2372]: บางปัญหาไม่ได้เกิดตลอดเพลง เช่น เบสบวมเฉพาะโน้ตต่ำบางตัว หรือเสียงร้องแหลมบาดเฉพาะคำที่ขึ้นเสียงสูง ถ้าใช้ Static EQ คัตทิ้งทั้งเพลง เสียงจะเสียในท่อนที่ไม่มีปัญหา บทนี้จะพาไปรู้จัก Dynamic EQ, Mid/Side และวิธีเทียบเสียงอย่างซื่อสัตย์กับหูตัวเอง
          - generic [ref=f1e2373]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2374]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2375]:
                - generic [ref=f1e2376]: EQ CURVE (จำลอง)
              - generic [ref=f1e2381]:
                - generic [ref=f1e2382]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - heading "1. Static EQ vs Dynamic EQ" [level=2] [ref=f1e2383]
          - paragraph [ref=f1e2385]: Static EQ คือการบูสต์หรือคัตคงที่ตลอดเวลา เหมาะกับปรับโทนรวมของเสียง ส่วน Dynamic EQ คือ EQ ที่ทำงานเฉพาะเมื่อสัญญาณในย่านนั้นดังเกิน Threshold ที่ตั้งไว้ คล้ายเอา Compressor กับ EQ มารวมกัน ข้อดีคือแก้ปัญหาเฉพาะจุดที่เกิด โดยไม่แตะเสียงในจังหวะที่ไม่มีปัญหา
          - paragraph [ref=f1e2387]: ตัวอย่างคลาสสิกคือเสียงร้องที่มีเสียง S แหลมบาดเฉพาะบางคำ ถ้าใช้ Static EQ กด 7 kHz ทิ้งทั้งเพลง เสียงร้องจะทึบตลอด แต่ถ้าใช้ Dynamic EQ ตั้งให้กด 7 kHz ลงเฉพาะตอนที่เสียง S โผล่ขึ้นมา ท่อนอื่นเสียงร้องจะยังใสเหมือนเดิม อีกตัวอย่างคือเบสที่บวมเฉพาะโน้ตต่ำบางตัว ก็ใช้ Dynamic EQ กดย่านนั้นเฉพาะตอนโน้ตนั้นดัง
          - generic [ref=f1e2389]:
            - strong [ref=f1e2390]: 🎧 ตัวอย่างการตั้ง Dynamic EQ (จุดเริ่มต้นให้ทดลอง)
            - paragraph [ref=f1e2391]: "สมมติเสียงร้องบาดที่ 6–8 kHz: เลือก Band นั้นเป็น Dynamic mode ตั้ง Threshold ให้เริ่มทำงานเฉพาะตอนคำที่บาดหู Ratio/Range ให้กดลง 3–5 dB Attack เร็วปานกลาง Release กลางๆ เหตุผลที่ต้องเริ่มเบาๆ เพราะ Dynamic EQ ที่กดแรงเกินไปทำให้เสียงร้องวูบวาบ ฟังแล้วเหนื่อยกว่าปัญหาเดิม"
          - heading "2. Mid/Side EQ คืออะไร" [level=2] [ref=f1e2393]
          - paragraph [ref=f1e2395]: เสียง Stereo แยกมองได้เป็นสองส่วนคือ Mid (สิ่งที่อยู่กลางเหมือนกันทั้งซ้ายขวา เช่น เสียงร้อง Kick เบส) กับ Side (สิ่งที่ต่างกันซ้ายขวา เช่น กีตาร์ประสาน รีเวิร์บ ฉาบ) Mid/Side EQ คือการ EQ สองส่วนนี้แยกกัน ทำให้แก้ปัญหาได้ละเอียดกว่า เช่น เพิ่ม Air ให้ Side อย่างเดียว เสียงจะกว้างฟุ้งโดยเสียงร้องตรงกลางไม่บาดหูตาม
          - paragraph [ref=f1e2397]: งานที่ใช้บ่อยคือคัต Sub ของ Side ออกเพื่อให้เสียงต่ำอยู่กลางแน่นๆ เบสไม่วูบวาบซ้ายขวา หรือลด Low-Mid ของ Mid เพื่อเคลียร์เสียงร้องโดยไม่ทำให้กีตาร์ด้านข้างผอมลง ข้อควรระวังคือ Mid/Side ที่ทำแรงเกินไปทำให้เฟสเพี้ยน ฟังใน Mono แล้วเสียงหาย ควรเช็ก Mono ทุกครั้งหลังแตะ Mid/Side (ใน FL ตรวจด้วย Wave Candy Correlation meter หรือปุ่ม Mono บน Master)
          - generic [ref=f1e2399]:
            - generic [ref=f1e2400]: ภาพจำลองเพื่อการเรียนรู้ — Maximus + Wave Candy
            - strong [ref=f1e2401]: 🖥️ เครื่องมือใน FL Studio
