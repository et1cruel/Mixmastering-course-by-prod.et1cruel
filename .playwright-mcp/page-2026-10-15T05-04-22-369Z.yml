        - generic [ref=f3e52]:
          - heading "Signal flow" [level=4] [ref=f3e53]
          - paragraph [ref=f3e54]: "ลำดับปลั๊กอินสำคัญ: Gain → EQ → Compressor → Reverb/Delay → Bus → Master"
      - heading "ข้อสำคัญ 10 ข้อ" [level=3] [ref=f3e55]
      - list [ref=f3e56]:
        - listitem [ref=f3e57]: ความถี่คือความสูงต่ำของเสียง วัดเป็น Hz และหูคนได้ยินช่วงประมาณ 20 Hz ถึง 20 kHz
        - listitem [ref=f3e58]: แอมพลิจูดคือความดังที่วัดเป็น dB ควรดูค่า dB ควบคู่กับการฟังเสมอ
        - listitem [ref=f3e59]: ระดับสูงสุดในดิจิทัลคือ 0 dBFS ค่าที่เกินนี้จะเกิดคลิป
        - listitem [ref=f3e60]: Mix คือทำให้เครื่องดนตรีแต่ละชิ้นอยู่ร่วมกันได้อย่างลงตัว
        - listitem [ref=f3e61]: Master คือทำให้เพลงทั้งเพลงดังพอดี โทนสม่ำเสมอ และพร้อมเผยแพร่
        - listitem [ref=f3e62]: Gain staging คือการจัดระดับสัญญาณทุกขั้นให้เหมาะตั้งแต่ต้นทาง
        - listitem [ref=f3e63]: ระดับ peak ของแต่ละแทร็กควรอยู่ราว -10 ถึง -6 dB ก่อนเข้า bus
        - listitem [ref=f3e64]: Headroom ประมาณ -6 dB ที่ master ช่วยให้ปลั๊กอินทำงานโดยไม่บิดเบี้ยว
        - listitem [ref=f3e65]: ลำดับ signal flow ทั่วไปคือ Gain, EQ, Compressor, Effects, Bus, Master
        - listitem [ref=f3e66]: ปรับ fader ก่อนใส่ปลั๊กอิน เพราะปลั๊กอินจะตอบสนองต่อระดับที่เข้าไปโดยตรง
      - heading "บทเรียนเชิงลึก (กดเพื่อเปิดอ่าน)" [level=3] [ref=f3e67]
