            - heading "Compressor คือพนักงานคุม Volume อัตโนมัติ" [level=3] [ref=f1e2677]
            - paragraph [ref=f1e2678]: จินตนาการว่ามีคนนั่งเฝ้า Fader คอยดึงเสียงลงทุกครั้งที่ดังเกินกำหนด แล้วดันกลับขึ้นมา นั่นคือสิ่งที่ Compressor ทำให้อัตโนมัติหลายสิบครั้งต่อวินาที บทนี้จะแกะทุกปุ่มว่ามันสั่งพนักงานคนนี้อย่างไร และอ่านมิเตอร์อย่างไรให้รู้ว่ากำลังทำอะไรอยู่
