              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2681]:
                - generic [ref=f1e2682]: INPUT ➜ OUTPUT (จำลอง)
              - generic [ref=f1e2687]:
                - generic [ref=f1e2688]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - 'heading "1. Threshold และ Ratio: เมื่อไรจะกด และกดแรงแค่ไหน" [level=2] [ref=f1e2689]'
          - paragraph [ref=f1e2691]: Threshold คือเส้นแบ่งว่าดังเกินแค่ไหนถึงจะเริ่มกด สัญญาณที่เบากว่า Threshold จะผ่านไป untouched ส่วนที่ดังกว่า Threshold จะถูกกดลง Ratio คือกดแรงแค่ไหน เช่น Ratio 2:1 หมายถึงเสียงที่เกินมา 2 dB จะเหลือออกไปแค่ 1 dB ส่วน 4:1 ก็กดแรงขึ้น ยิ่ง Ratio สูงยิ่งเสียงนิ่ง แต่ยิ่งเสี่ยงแบนไร้ชีวิต
          - paragraph [ref=f1e2693]: มือใหม่มักตั้ง Threshold ต่ำเกินไปจน Compressor กดตลอดเวลา เสียงเลยอู้และเหนื่อย หลักที่ถูกคือตั้งให้กดเฉพาะยอดดังที่โดดออกมา สังเกตจาก Gain Reduction meter ว่าเข็มขยับเฉพาะตอนเสียงดัง ไม่ใช่จมตลอด ถ้าเข็มไม่ยอมกลับมาศูนย์เลย แปลว่ากดหนักไปหรือ Threshold ต่ำไป
          - generic [ref=f1e2695]:
            - strong [ref=f1e2696]: 🎧 ตัวอย่างค่าเริ่มต้น (จุดเริ่มต้นให้ทดลอง)
            - paragraph [ref=f1e2697]: เสียงร้องป๊อปทั่วไปมักเริ่มที่ Ratio 2:1–3:1 ตั้ง Threshold ให้ Gain Reduction ขยับราว 2–4 dB เฉพาะคำที่ดัง เหตุผลที่ไม่กดมากกว่านี้ตั้งแต่แรกเพราะเสียงร้องต้องการอารมณ์เบาดังตามธรรมชาติ ถ้ากดจนทุกคำดังเท่ากันหมด เพลงจะฟังแล้วแบนและน่าเบื่อ
          - 'heading "2. Attack และ Release: จังหวะการกดและปล่อย" [level=2] [ref=f1e2699]'
          - paragraph [ref=f1e2701]: Attack คือกดเร็วแค่ไหนหลังเสียงข้าม Threshold Attack ไว (เช่น 1–10 ms) จะจับ Transient อยู่ เสียงจะนิ่งแต่หัวอาจทู่ Attack ช้า (เช่น 30–100 ms) จะปล่อยให้หัวเสียงผ่านไปก่อนแล้วค่อยกดเนื้อตาม เสียงจะยังกระแทกแต่เนื้อจะนิ่งขึ้น การเลือก Attack คือการเลือกว่าจะเก็บหัวเสียงไว้หรือจะกดมันลง
          - paragraph [ref=f1e2703]: Release คือปล่อยเร็วแค่ไหนหลังเสียงตกลงมาต่ำกว่า Threshold Release สั้นไปทำให้เสียงวูบวาบเป็นปั๊ม (Pumping) Release ยาวไปทำให้ Compressor ไม่ทันปล่อยก่อนโน้ตต่อไปมา เสียงจะอู้และจังหวะหาย หลักปฏิบัติคือตั้ง Release ให้เข็ม Gain Reduction กลับมาศูนย์พอดีก่อนเสียงตัวต่อไปมา แล้วฟังว่าจังหวะยังหายใจได้หรือไม่
          - heading "Knee และ Makeup Gain" [level=3] [ref=f1e2705]
          - paragraph [ref=f1e2707]: Knee คือความนุ่มนวลตรงจุดเริ่มกด Hard knee เริ่มกดทันทีที่ข้าม Threshold เสียงจะชัดเด็ดขาด เหมาะกับกลองที่ต้องการความคม Soft knee ค่อยๆ เริ่มกดก่อนถึง Threshold เสียงจะเนียนเป็นธรรมชาติ เหมาะกับเสียงร้องและเบส ส่วน Makeup Gain คือปุ่มชดเชยความดังที่เสียไปตอนกด เพราะหลังกดเสียงจะเบาลง เราจึงดันกลับขึ้นมาให้ดังเท่าเดิมก่อนเทียบ
          - generic [ref=f1e2709]:
            - generic [ref=f1e2710]: ภาพจำลองเพื่อการเรียนรู้ — Fruity Compressor / Limiter
            - strong [ref=f1e2711]: 🖥️ หน้าตาใน Fruity Compressor / Limiter
            - paragraph [ref=f1e2712]: Fruity Limiter ในโหมด Compressor มีปุ่ม Threshold, Ratio, Attack, Release, Knee และ Gain ให้ครบ มิเตอร์ Gain Reduction แสดงเป็นแถบวิ่งว่าโดนกดไปกี่ dB แบบเรียลไทม์ ลองปรับ Threshold ลงช้าๆ แล้วดูแถบ GR ขยับเฉพาะยอดดัง
          - heading "3. อ่านมิเตอร์เป็น เลิกหมุนมั่ว" [level=2] [ref=f1e2714]
          - paragraph [ref=f1e2716]: มิเตอร์ที่สำคัญที่สุดคือ Gain Reduction (GR) บอกว่าตอนนี้โดนกดไปกี่ dB ถ้า GR ขยับ 1–3 dB เฉพาะยอดดัง ถือว่ากดเบาๆ ธรรมชาติ ถ้าจม 6–10 dB ตลอดเวลา ถือว่ากดหนัก ต้องมีเหตุผลรองรับเช่น ต้องการ Effect พิเศษ อีกมิเตอร์คือ Input/Output เปรียบเทียบว่าเสียงเข้ากับออกต่างกันแค่ไหน ถ้า Output เบากว่า Input มาก อย่าลืมชดเชยด้วย Makeup Gain ก่อนตัดสินว่าเสียงดีขึ้นหรือแย่ลง
          - generic [ref=f1e2717]:
            - heading "ขั้นตอนตั้ง Compressor แบบเป็นระบบ" [level=4] [ref=f1e2718]
            - list [ref=f1e2719]:
              - listitem [ref=f1e2720]: เริ่มจาก Ratio กลางๆ (เช่น 3:1) Attack กลาง Release กลาง แล้วค่อยๆ ลด Threshold ลงจน GR ขยับ 2–3 dB
              - listitem [ref=f1e2721]: "ปรับ Attack: ถ้าอยากได้หัวคมให้ช้าลง ถ้าอยากได้นิ่งให้ไวขึ้น ฟังทีละคลิก"
              - listitem [ref=f1e2722]: "ปรับ Release: ให้เข็มกลับศูนย์ก่อนโน้ตต่อไป ถ้าได้ยินเสียงวูบวาบให้ยืด Release ออก"
