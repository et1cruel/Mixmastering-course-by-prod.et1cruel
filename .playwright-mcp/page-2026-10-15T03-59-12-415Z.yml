            - listitem [ref=f1e2815]: แก้ปัญหา Pumping โดยไม่ต้องเลิกใช้ Compressor
          - generic [ref=f1e2816]:
            - heading "จากปุ่มพื้นฐานสู่เทคนิคที่ใช้จริงทุกเพลง" [level=3] [ref=f1e2817]
            - paragraph [ref=f1e2818]: พอเข้าใจปุ่ม Compressor แล้ว คำถามต่อไปคือแต่ละเครื่องดนตรีควรกดอย่างไร และเทคนิคที่โปรใช้กันอย่าง Sidechain กับ Parallel คืออะไร บทนี้รวมทุกอย่างเป็นแผนที่เดียว ตั้งแต่กลอง เบส ร้อง ไปจนถึงการต่อ Compressor หลายตัวเข้าด้วยกัน
          - generic [ref=f1e2819]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2820]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2821]:
                - generic [ref=f1e2822]: INPUT ➜ OUTPUT (จำลอง)
              - generic [ref=f1e2827]:
                - generic [ref=f1e2828]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - 'heading "1. กลอง: คมหรือแน่น เลือกสักทาง" [level=2] [ref=f1e2829]'
          - paragraph [ref=f1e2831]: กลองมีสองสไตล์หลักคือแบบคมกระแทก (Punchy) ที่เน้น Transient กับแบบแน่นสม่ำเสมอ (Glue) ที่เน้น Body ถ้าอยากได้คม ให้ใช้ Attack ช้าปล่อยหัวผ่าน Ratio กลางๆ กดแค่ 2–4 dB ถ้าอยากได้แน่น ให้ใช้ Attack ไวขึ้น Ratio สูงขึ้น แต่ต้องระวังว่ากดกลองหนักไปจะทำให้จังหวะเพลงทู่และ Hi-hat โดนดูดไปด้วยถ้ากดทั้ง Bus
          - paragraph [ref=f1e2833]: กับดักของกลองคือการกด Drum bus แรงๆ ตั้งแต่แรกแล้วหวังว่าเพลงจะแน่น วิธีที่ปลอดภัยกว่าคือกดเบาๆ ทีละแทร็กก่อน (Kick, Snare แยกกัน) แล้วค่อยกด Drum bus เบาๆ อีกชั้นเพื่อ Glue วิธีนี้เรียกว่า Serial compression คือกดน้อยๆ หลายรอบแทนการกดหนักรอบเดียว เสียงจะนิ่งแต่ยังมีชีวิต
          - generic [ref=f1e2834]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2835]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2836]:
                - generic [ref=f1e2837]: INPUT ➜ OUTPUT (จำลอง)
              - generic [ref=f1e2842]:
                - generic [ref=f1e2843]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - heading "2. เบสและเสียงร้อง" [level=2] [ref=f1e2844]
          - paragraph [ref=f1e2846]: เบสต้องการความนิ่งเพราะมีหน้าที่อุ้มเพลง ถ้าโน้ตต่ำบางตัวดังโดดหรือบางตัวหาย เพลงจะโยกเยก นิยมใช้ Attack กลางๆ ไม่ไวจนกดนิ้วดีดหาย Ratio 2:1–4:1 กด 3–5 dB เป็นจุดเริ่มต้นให้ทดลอง ส่วนเสียงร้องต้องการทั้งความนิ่งและความเป็นธรรมชาติ นิยมกดเบาๆ 2–4 dB ด้วย Attack ช้าหน่อยเพื่อเก็บอารมณ์คำร้อง แล้วค่อยกดอีกชั้นบน Vocal bus ถ้ายังไม่นิ่งพอ
          - generic [ref=f1e2848]:
            - strong [ref=f1e2849]: 🎧 ตัวอย่าง Serial บนเสียงร้อง (จุดเริ่มต้นให้ทดลอง)
            - paragraph [ref=f1e2850]: Compressor ตัวแรกบนแทร็กร้องกดเบาๆ 2–3 dB เพื่อเก็บยอดดัง ตัวที่สองกดอีก 1–2 dB เพื่อ Glue ให้คำเบาฟังชัดขึ้น เหตุผลที่แบ่งสองตัวเพราะการกด 5 dB ด้วยตัวเดียวมักทิ้งร่องรอยชัดกว่าการกด 2+2 dB ด้วยสองตัว ฟังเทียบแล้วเลือกแบบที่เสียงร้องยังหายใจได้
          - generic [ref=f1e2851]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2852]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2853]:
                - generic [ref=f1e2854]: INPUT ➜ OUTPUT (จำลอง)
              - generic [ref=f1e2859]:
