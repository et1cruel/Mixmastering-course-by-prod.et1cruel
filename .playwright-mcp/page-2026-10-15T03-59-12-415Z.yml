                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - 'heading "3. Sidechain: สั่งให้เบสหลบ Kick อัตโนมัติ" [level=2] [ref=f1e2861]'
          - paragraph [ref=f1e2863]: Sidechain คือการเอาเสียงหนึ่ง (เช่น Kick) มาสั่งให้ Compressor ของอีกเสียงหนึ่ง (เช่น เบส) ทำงาน ผลคือทุกครั้งที่ Kick ดัง เบสจะถูกกดลงชั่วครู่แล้วเด้งกลับ ทำให้ Kick ชัดโดยไม่ต้องลดเบสทั้งเพลง เทคนิคนี้คือหัวใจของเพลง EDM, House และเพลงป๊อปจังหวะชัดๆ เกือบทุกเพลง
          - generic [ref=f1e2865]:
            - generic [ref=f1e2866]: ภาพจำลองเพื่อการเรียนรู้ — Fruity Limiter Sidechain
            - strong [ref=f1e2867]: 🖥️ ต่อ Sidechain ใน FL Studio
            - paragraph [ref=f1e2868]: ใน Fruity Limiter บนแทร็กเบส เลือก Sidechain input เป็นแทร็ก Kick ตั้ง Ratio กลางๆ Attack ไว Release ตามจังหวะเพลง (เริ่มราว 100–200 ms แล้วฟัง) กดลง 3–6 dB เป็นจุดเริ่มต้นให้ทดลอง ถ้าได้ยินเสียงดูดวูบชัดเกินไปให้ลด Ratio หรือยืด Release
          - 'heading "Pumping: เอฟเฟกต์หรืออุบัติเหตุ" [level=3] [ref=f1e2870]'
          - paragraph [ref=f1e2872]: Pumping คืออาการเสียงวูบวาบตามจังหวะกด-ปล่อยของ Compressor ในเพลง Dance จงใจทำให้ปั๊มเพื่อความเต้น แต่ในเพลงช้าหรือเพลงร้อง Pumping คืออุบัติเหตุที่ทำให้ฟังแล้วเวียนหัว วิธีแก้คือยืด Release ให้ยาวขึ้น ลด Ratio ลง หรือยก Threshold ขึ้นให้กดเบาลง ถ้ายังปั๊มอยู่ให้สงสัยว่า Release สั้นกว่าจังหวะเพลง
          - heading "4. Parallel และ Bus compression" [level=2] [ref=f1e2874]
          - paragraph [ref=f1e2876]: Parallel compression (New York style) คือการผสมเสียงกดหนักกับเสียงต้นฉบับเข้าด้วยกัน วิธีทำคือ Duplicate แทร็กกลองหรือร้อง กดตัวก๊อปหนักๆ (เช่น 8–10 dB) แล้วค่อยๆ ดันขึ้นมาผสมกับตัวจริง ผลคือได้ความแน่นโดยไม่เสีย Transient ของตัวจริง เหมาะกับกลองและร้องที่อยากได้พลังแต่ยังอยากให้หัวชัด
          - paragraph [ref=f1e2878]: Bus compression คือการกดรวมทั้งกลุ่ม เช่น Drum bus หรือ Mix bus เบาๆ (1–2 dB) เพื่อให้ทุกชิ้นเกาะกันเป็นเนื้อเดียว หลักสำคัญคือกดเบามากๆ Attack ช้า Release ตามจังหวะเพลง ถ้ากด Bus หนัก เพลงจะหายใจไม่ออกและแก้ยาก เพราะกระทบทุกอย่างพร้อมกัน
          - generic [ref=f1e2879]:
