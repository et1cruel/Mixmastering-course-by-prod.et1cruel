              - listitem [ref=e2052]: Mixing — คำถามคือ "ทุกเสียงอยู่ด้วยกันอย่างไร" เน้นสมดุล ความชัด และมิติ
              - listitem [ref=e2053]: Mastering — คำถามคือ "พร้อมปล่อยหรือยัง" เน้น loudness, เสียงรวม และ format ส่งออก
