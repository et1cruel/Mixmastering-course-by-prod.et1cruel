            - heading "Production vs Mixing vs Mastering คืออะไร" [level=2] [ref=e2046]
          - paragraph [ref=e2048]: Production คือการสร้างดนตรี ได้แก่การแต่ง ทำนอง เลือกเสียง อัดร้อง และเรียบเรียง (arrangement) ผลลัพธ์คือไอเดียเพลงที่สมบูรณ์ ส่วน Mixing คือการนำทุกแทร็กมาปรับสมดุลด้วย volume, pan, EQ, compression, reverb และ automation ให้ทุกชิ้นอยู่ด้วยกันได้ ส่วน Mastering คือการ polish ไฟล์สเตอริโอสุดท้ายให้ดังสม่ำเสมอ ฟังดีทุกอุปกรณ์ และพร้อมปล่อย
