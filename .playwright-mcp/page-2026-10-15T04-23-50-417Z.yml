          - paragraph [ref=e2077]: Signal Flow คือเส้นทางการเดินทางของเสียงจากต้นกำเนิด (source) ผ่าน processing ต่างๆ ไปยังลำโพง ตัวอย่างพื้นฐานคือ ไมค์หรือ VST → channel fader → insert effects → mixer track → bus/group → master bus → audio interface → monitor ความเข้าใจ flow นี้ช่วยให้ตามหาปัญหาได้เร็วว่าเสียงหายหรือเพี้ยนที่จุดไหน
