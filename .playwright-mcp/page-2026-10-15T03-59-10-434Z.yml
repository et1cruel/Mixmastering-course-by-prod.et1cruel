            - paragraph [ref=f1e2505]: Compressor ไม่ใช่ปุ่มทำให้เสียงดังหรือเสียงดี แต่คือเครื่องมือจัดการความต่างระหว่างเสียงเบากับเสียงดัง บทนี้จะปูพื้นฐานว่าเสียงแต่ละชิ้นเกิด ดำรงอยู่ และดับไปอย่างไร เพื่อให้บทต่อไปหมุน Compressor แล้วรู้ว่ากำลังทำอะไรกับเสียงอยู่
