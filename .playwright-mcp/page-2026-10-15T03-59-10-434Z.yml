            - 'heading "2. Transient vs Body: หัวไม้กับเนื้อไม้" [level=2] [ref=f1e2531]'
          - paragraph [ref=f1e2533]: เสียงเครื่องดนตรีเกือบทุกชิ้นแบ่งได้เป็นสองส่วนคือ Transient ซึ่งเป็นหัวเสียงช่วงแรกที่ดังสั้นๆ เช่น เสียงไม้ตีกระทบหนังสแนร์ หรือเสียงปิ๊กกระทบสายกีตาร์ ส่วนที่เหลือคือ Body/Sustain ซึ่งเป็นเนื้อเสียงที่ลากยาวตามมา Transient บอกจังหวะและความกระแทก ส่วน Body บอกความอิ่มและโทน
          - paragraph [ref=f1e2535]: ลองนึกภาพ Transient เป็นหัวไม้ขีดที่จุดติดวูบเดียว ส่วน Body เป็นเปลวเทียนที่ลุกต่อ ถ้า Transient หายไป กลองจะฟังแล้วทู่ จังหวะไม่ชัด ถ้า Body หายไป กลองจะเหลือแต่เสียงแป๊กๆ ไม่มีน้ำหนัก การมิกซ์ที่ดีต้องตัดสินใจว่าจะเน้นหัวหรือเนื้อของแต่ละชิ้น ไม่ใช่ทำให้ทุกอย่างกระแทกพร้อมกันหมด
          - generic [ref=f1e2537]:
            - generic [ref=f1e2538]: ภาพจำลองเพื่อการเรียนรู้ — Edison / Wave Candy
            - strong [ref=f1e2539]: 🖥️ ดู Transient ด้วยตาใน FL Studio
            - paragraph [ref=f1e2540]: เปิด Edison หรือ Playlist waveform ซูมดูหัวเสียงสแนร์ จะเห็นยอดแหลมช่วงแรก (Transient) แล้วตามด้วยคลื่นที่เตี้ยลง (Body) เปิด Wave Candy ในโหมด Oscilloscope หรือ Meter ควบคู่กันจะเห็นยอด Peak กระโดดตาม Transient แบบเรียลไทม์
          - 'heading "3. ADSR: แผนที่ชีวิตของหนึ่งเสียง" [level=2] [ref=f1e2542]'
