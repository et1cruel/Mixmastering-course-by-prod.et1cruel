            - heading "1. Dynamics และ Dynamic range" [level=2] [ref=f1e2516]
          - paragraph [ref=f1e2518]: Dynamics คือความเปลี่ยนแปลงของความดังในเพลง ตั้งแต่เสียงกระซิบเบาๆ ไปจนถึงท่อนฮุกที่ดังสุด Dynamic range คือระยะห่างระหว่างจุดเบาสุดกับดังสุด เพลงบรรเลงเปียโนอาจมี Dynamic range กว้างมาก ส่วนเพลง EDM ที่อัดแน่นทั้งเพลงจะมี Range แคบ การมิกซ์คือศิลปะของการจัด Range นี้ให้เพลงมีชีวิตแต่ยังฟังชัดในทุกอุปกรณ์
          - paragraph [ref=f1e2520]: ปัญหาที่พบบ่อยคือ Range กว้างเกินไปจนท่อนเบาฟังไม่รู้เรื่องในรถยนต์ หรือแคบเกินไปจนเพลงแบนไม่มีอารมณ์ Compressor, Limiter และ Automation ล้วนเป็นเครื่องมือจัดการเรื่องนี้ทั้งสิ้น แต่ถ้าใช้โดยไม่เข้าใจว่าเสียงไหนควรคงไดนามิกไว้ เราจะได้เพลงที่ดังแต่ไร้ชีวิตกลับมา
          - generic [ref=f1e2521]:
