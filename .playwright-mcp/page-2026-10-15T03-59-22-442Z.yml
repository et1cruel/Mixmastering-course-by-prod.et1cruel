          - 'heading "เช็กพรีมาสเตอร์: 7 ข้อก่อนเริ่ม" [level=2] [ref=f1e5611]'
          - generic [ref=f1e5612]:
            - heading "Premaster QC (ต้องผ่านก่อนมาสเตอร์)" [level=4] [ref=f1e5613]
            - list [ref=f1e5614]:
              - listitem [ref=f1e5615]: ไฟล์ WAV 24-bit (หรือ 32-bit float) sample rate เท่า session ไม่ dither ไม่ normalize
              - listitem [ref=f1e5616]: พีค -6 ถึง -3dBFS มี headroom ไม่มีคลิป (true peak ต่ำกว่า 0)
              - listitem [ref=f1e5617]: "ฟังทั้งเพลง: ไม่มีคลิก/ป๊อป/เสียงแก้ไอ/ fade หลุด"
              - listitem [ref=f1e5618]: "mono check ผ่าน: พระเอกไม่หาย (ถ้าตกตรงนี้กลับไปแก้มิกซ์ อย่าฝืนมาสเตอร์)"
              - listitem [ref=f1e5619]: "หัว-ท้ายเพลง: มี silence เผื่อ 0.5-1 วินาที fade เรียบร้อย"
              - listitem [ref=f1e5620]: "เวอร์ชันถูก: ชื่อไฟล์มีเวอร์ชัน เก็บมิกซ์ต้นฉบับแยก"
              - listitem [ref=f1e5621]: "พักหู: ไม่มาสเตอร์ต่อจากมิกซ์มาราธอนทันที"
          - generic [ref=f1e5623]:
            - generic [ref=f1e5624]: ภาพจำลองเพื่อการเรียนรู้ ไม่ใช่ภาพหน้าจอจริงของ FL Studio
            - strong [ref=f1e5625]: "🖥️ ภาพจำลอง: Session มาสเตอริงใหม่ที่สะอาด"
            - paragraph [ref=f1e5626]: "[Project MASTER: Track 1 = Mix_v3.wav (สเตอริโอเดียว)] [Mixer Master: EQ > Glue > Saturation > Stereo > Limiter > Meter] [Track 2 = Reference (bypass chain)] สลับ A/B ได้ทันที"
          - heading "Gain staging ของเชนมาสเตอร์" [level=2] [ref=f1e5628]
          - paragraph [ref=f1e5630]: "หลักการ: แต่ละตัวในเชนควรขยับเกนแค่ 1-3dB รวมกันแล้วได้ผลใหญ่ ถ้าตัวใดตัวหนึ่งต้องบูสต์/กดเกิน 4dB แปลว่าปัญหาอยู่ที่มิกซ์ กลับไปแก้ดีกว่าเร่งที่มาสเตอร์ และทุกครั้งที่เพิ่มตัวใหม่ ให้ level-match ก่อนตัดสินใจว่า \"ดีขึ้นจริง\""
          - generic [ref=f1e5632]:
            - strong [ref=f1e5633]: ⚠️ อย่าแก้ปัญหามิกซ์ด้วยมาสเตอริง
            - paragraph [ref=f1e5634]: ร้องจม เบสบวม สแนร์บาด แก้ที่มิกซ์ได้ดีกว่า 10 เท่า มาสเตอริงแก้ได้แค่ภาพรวม ถ้าพบปัญหาเฉพาะจุด (เช่น สแนร์บาดท่อนเดียว) ให้กลับไปแก้มิกซ์ อย่าฝืนกดทั้งเพลงเพราะท่อนเดียว
          - generic [ref=f1e5636]:
