          - heading "Monitoring และ Reference Track" [level=2] [ref=f1e1040]
          - paragraph [ref=f1e1042]: Monitoring คือคุณภาพของการฟัง เริ่มจากวางลำโพงเป็นสามเหลี่ยมด้านเท่ากับหู ทวีตเตอร์ระดับหู หลีกเลี่ยงมุมห้องที่เบสบวม และคุมระดับฟังให้คงที่ปานกลางไม่ดังสลับเบา ส่วน Reference Track คือเพลงอ้างอิงที่ชอบและเสียงดีในแนวเดียวกัน เอาไว้สลับฟังเทียบว่า mix ของเราขาดอะไร วิธีนี้แก้หูชิน (ear fatigue) ได้ดีที่สุดสำหรับมือใหม่
