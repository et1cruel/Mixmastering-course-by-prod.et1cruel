                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - heading "Sample Rate และ Bit Depth" [level=2] [ref=f1e1014]
          - paragraph [ref=f1e1016]: Sample Rate คือจำนวนครั้งที่สุ่มเก็บเสียงต่อวินาที หน่วย Hz ตามทฤษฎี Nyquist ต้องสุ่มเกิน 2 เท่าของความถี่สูงสุดที่ต้องการเก็บ ดังนั้น 44.1 kHz เก็บได้ถึงราว 20 kHz ครอบคลุมหูมนุษย์พอดี ส่วน 48 kHz เป็นมาตรฐานวิดีโอและสตรีมมิงยุคนี้ การอัดและ export ที่ 48 kHz (จุดเริ่มต้น) จึงเข้ากันได้กับงานภาพและแพลตฟอร์มส่วนใหญ่โดยไม่ต้องแปลงบ่อย
          - paragraph [ref=f1e1018]: Bit Depth คือความละเอียดของแต่ละ sample 16-bit มี dynamic range ราว 96 dB ส่วน 24-bit มีราว 144 dB หมายความว่า 24-bit เก็บรายละเอียดเสียงเบาได้ดีกว่าและทนการ process หนักๆ ได้โดย noise floor ต่ำกว่า สำหรับมือใหม่ให้อัดและ export ที่ 48 kHz / 24-bit (จุดเริ่มต้น) ไฟล์ไม่ใหญ่เกินไปแต่คุณภาพเหลือพอสำหรับ mixing และ mastering
