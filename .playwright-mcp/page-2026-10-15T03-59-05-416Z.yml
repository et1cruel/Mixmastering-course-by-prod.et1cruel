          - paragraph [ref=f1e1745]: Mono คือการรวมซ้ายขวาเป็นช่องเดียว ลำโพงบลูทูธหลายรุ่น มือถือ และคลับใช้ mono วิธีเช็กคือกดปุ่ม mono บน master (หรือใช้ Fruity Stereo Enhancer หมุน stereo separation ลงสุด) แล้วฟังว่าเสียงไหนหายหรือเบาลงผิดปกติ สาเหตุยอดฮิตคือ widening หนักเกิน, delay ซ้ายขวาคนละเวลา หรือเลเยอร์เดียวกัน pan สุดขอบแล้ว phase ตรงข้ามกัน
