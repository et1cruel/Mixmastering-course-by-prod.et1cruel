              - listitem [ref=f1e1752]: เช็กซ้ำ mono รอบสองก่อนถือว่าผ่าน
          - generic [ref=f1e1754]:
            - generic [ref=f1e1755]: ภาพจำลองเพื่อการเรียนรู้
            - strong [ref=f1e1756]: 🖥️
            - paragraph [ref=f1e1757]: ใน FL Studio 25 ใส่ Fruity Stereo Enhancer ที่ master bus ชั่วคราว หมุน separation ลงจนสุดเพื่อฟัง mono อย่าลืม bypass ออกหลังเช็กเสร็จ สำหรับแก้ polarity ให้ใช้ Fruity Phase Inverter หรือปุ่ม invert บน samplers บางตัว ส่วนดู waveform ให้ดับเบิลคลิกไฟล์ใน Playlist ซูมดูยอดคลื่นว่าเลเยอร์ตรงกันไหม
          - paragraph [ref=f1e1759]: มิเตอร์ 4 ตัวที่ต้องอ่านคือ Peak meter (กัน clip), RMS/loudness (ดูความดังเฉลี่ย), Correlation meter (ดู phase ซ้ายขวา ค่าบวกคือดี ติดลบคือเสี่ยงหายใน mono) และ Spectrum (Parametric EQ 2 ดูว่าย่านไหนล้น) กฎฝึกคือ correlation ควรอยู่โซนบวกตลอดเพลง ถ้าตกติดลบบ่อยให้สงสัย widening หรือ delay สเตอริโอ
