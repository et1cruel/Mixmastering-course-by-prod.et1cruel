            - heading "Normalization ของแพลตฟอร์ม (คอนเซปต์)" [level=2] [ref=f1e6158]
          - paragraph [ref=f1e6160]: "แพลตฟอร์มสตรีมมิงมีปุ่ม normalization: ถ้าเพลงเราดังกว่าเกณฑ์ เขาจะลดวอลลุ่มลงให้เท่าเพลงอื่น ถ้าเบากว่า เขาจะเร่งขึ้น (แต่เร่งได้จำกัดและอาจดันนอยส์) ผลคือ \"อัดดังเกินไม่ได้ดังกว่า\" แถมเพลงที่บีบแบนจะฟังแย่กว่าเพลงไดนามิกดีที่โดนลดมาเท่าๆ กัน ดังนั้นเป้าหมายคือมิกซ์/มาสเตอร์ให้ไดนามิกดี ไม่ใช่บีบให้ตัวเลข integrated ดังสุด"
          - generic [ref=f1e6162]:
            - strong [ref=f1e6163]: ⚠️ ไม่มีเลขวิเศษเลขเดียว
            - paragraph [ref=f1e6164]: "อย่ายึดว่า \"ต้อง -14 LUFS ทุกเพลง\" เพราะแต่ละแพลตฟอร์มเกณฑ์ต่างกัน เปลี่ยนได้ตลอด และเพลงแต่ละแนวเหมาะกับความดังต่างกัน ให้ใช้หลัก: เพลงเบา-ไดนามิกกว้าง (อะคูสติก แจ๊ส) ดังน้อยกว่าได้ เพลงจังหวะหนัก (ป๊อป แดนซ์ ฮิปฮอป) ดังกว่าได้ แต่ทุกแนวต้อง true peak ปลอดภัยและไม่แตก"
