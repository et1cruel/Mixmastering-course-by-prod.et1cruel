          - paragraph [ref=f1e6291]: "Crest factor คือระยะห่างระหว่างพีคกับความดังเฉลี่ย (peak − RMS/LUFS คร่าวๆ) ค่ามาก = ไดนามิกกว้าง (กลองเด้ง) ค่าน้อย = แบนแน่น (EDM ดังสุด) ถ้าบีบจน crest เหลือน้อยมาก เพลงจะล้าและทรานเซียนต์หาย วิธีรักษา: ดัน gain ทีละ 0.5dB ฟังเทียบ crest อย่าปล่อยให้ verse-hook กลายเป็นก้อนเดียวกัน"
