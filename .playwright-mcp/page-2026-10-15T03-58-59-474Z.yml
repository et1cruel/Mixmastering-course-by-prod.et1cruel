            - paragraph [ref=f1e739]: อย่า Solo ฟังเสียงแล้วตัดสินใจทุกอย่าง เสียง saw ที่ฟังเดี่ยวๆ อาจเท่ แต่พอรวมกับกีตาร์และร้องอาจแย่งย่าน 2–5 kHz จน mix แน่นไปหมด ให้ตัดสินใจเรื่อง timbre ใน context ของทั้งเพลงเสมอ และระวังการบูสต์ high-frequency มากเกินเพราะหูล้าเร็ว
