            - generic [ref=f1e733]: ภาพจำลองเพื่อการเรียนรู้
            - strong [ref=f1e734]: 🖥️
            - paragraph [ref=f1e735]: ใน FL Studio 25 เปิด 3HOSC เล่นโน้ตค้างแล้วเปิด Wave Candy ในโหมด Oscilloscope ดูรูปคลื่นเปลี่ยนตามทรงที่เลือก จากนั้นเปิด Parametric EQ 2 ดู spectrum ว่า saw มีแท่ง harmonics ยาวกว่า sine อย่างไร ให้ลด volume ก่อนสลับไป saw เพราะ saw ดังกว่าและแสบหูกว่า
          - generic [ref=f1e737]:
