          - generic [ref=f1e728]:
            - strong [ref=f1e729]: "🎧 ตัวอย่าง: โน้ตเดียวกัน คนละเครื่อง"
            - paragraph [ref=f1e730]: ให้เล่นโน้ต C3 จาก 3HOSC ด้วย sine ล้วนจะได้เสียงอู้อี้คล้ายไซน์เบส เปลี่ยนเป็น saw จะได้เสียงแสบพุ่งทันทีทั้งที่ pitch เดียวกันเพราะ harmonics เพิ่มขึ้น ในเพลงจริง kick กับ bass มักชนกันที่ 50–100 Hz ส่วน vocal กับ snare ชนกันที่ 2–5 kHz การรู้ว่าใครมี harmonics ตรงไหนช่วยให้เลือกว่าจะ cut ชิ้นไหน ไม่ใช่บูสต์ทุกชิ้น
