          - heading "2. ฟิลเตอร์ 5 ชนิด" [level=2] [ref=f1e2096]
          - paragraph [ref=f1e2098]: High-Pass Filter (HPF) ปล่อยเสียงสูงผ่านไป ตัดเสียงต่ำทิ้ง ใช้กันเสียงลม เสียงเหยียบพื้น หรือ Sub ที่ไม่จำเป็น Low-Pass Filter (LPF) ตรงกันข้าม ปล่อยเสียงต่ำผ่าน ตัดเสียงสูงทิ้ง ใช้ทำเสียงไกลๆ เสียง Lo-fi หรือกดเสียงซ่าของแทร็กที่ไม่ต้องการความใส ทั้งสองตัวคุมด้วยความถี่จุดตัดและ Slope
          - paragraph [ref=f1e2100]: Bell คือกระพุ้งขึ้นหรือลงเฉพาะย่านที่เลือก ใช้บ่อยที่สุด Shelf คือยกหรือกดทั้งชั้นตั้งแต่จุดที่เลือกขึ้นไปหรือลงไป เหมาะปรับโทนรวมเช่น เพิ่ม Air หรือลดความอู้ ส่วน Notch คือ Bell ที่แคบมากๆ ใช้ตัดความถี่ปัญหาแบบผ่าตัด เช่น เสียงหอน 50/60 Hz หรือเสียงหวีดแหลมๆ
          - generic [ref=f1e2102]:
            - generic [ref=f1e2103]: ภาพจำลองเพื่อการเรียนรู้ — Fruity Parametric EQ 2
            - strong [ref=f1e2104]: 🖥️ หน้าตาใน Parametric EQ 2
            - paragraph [ref=f1e2105]: Band 1 และ Band 7 ใน Parametric EQ 2 ปรับเป็น HPF/LPF/Shelf ได้โดยคลิกขวาที่ปุ่ม Shape ส่วน Band กลางๆ เป็น Bell/Notch ตามค่า Q วงแหวนรอบปุ่มคือ Gain เส้นโค้งสีคือผลลัพธ์รวม ลองลาก Band แล้วดูเส้นเปลี่ยนพร้อมฟังเสียง
          - generic [ref=f1e2107]:
            - strong [ref=f1e2108]: 🎧 ตัวอย่างการตั้งค่า (จุดเริ่มต้นให้ทดลอง)
            - paragraph [ref=f1e2109]: "HPF เสียงร้อง: เริ่มที่ 70–90 Hz Slope 18–24 dB/oct เพราะเสียงร้องทั่วไปมี Fundamental ต่ำสุดราว 85 Hz การตัดต่ำกว่านั้นจึงมักเอาแค่เสียงลมและเสียงกระแทกขาตั้งออก ไม่ใช่เนื้อเสียง แต่ถ้าเป็นเสียงร้องทุ้มมากๆ หรือเพลงช้าที่ต้องการความอุ่น ให้ลองขยับลงแล้วฟังว่าอุ่นหายไปหรือไม่"
          - generic [ref=f1e2111]:
            - strong [ref=f1e2112]: "🎧 ตัวอย่าง: Bell vs Shelf กับเสียงแหลม"
            - paragraph [ref=f1e2113]: อยากเพิ่มความใสเสียงร้อง มีสองทางคือ High Shelf ที่ 10–12 kHz +1–2 dB จะได้ Air ทั้งแผง หรือ Bell ที่ 8 kHz Q กว้างๆ +1.5 dB จะได้ความใสเฉพาะจุดกว่า Shelf เหมาะกับเพลงที่ต้องการความฟุ้ง ส่วน Bell เหมาะกับเพลงที่ต้องการความใสแต่กลัวฉาบจะจ้าตามไปด้วย ลองทั้งสองแบบแล้วเลือก
          - generic [ref=f1e2115]:
