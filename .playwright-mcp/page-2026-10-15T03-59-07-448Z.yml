            - paragraph [ref=f1e2117]: Slope 48 dB/oct ตัดสะอาดก็จริง แต่ขอบที่ชันเกินไปทำให้เกิดอาการ Ringing หรือเสียงเปลี่ยนเฟสจนฟังแล้วแปลก โดยเฉพาะกับเสียงเบสและเสียงร้อง หลักปฏิบัติคือเริ่มจาก Slope กลางๆ อย่าง 18–24 dB/oct ก่อน ถ้ายังมีเสียงต่ำเล็ดลอดค่อยขยับให้ชันขึ้น
