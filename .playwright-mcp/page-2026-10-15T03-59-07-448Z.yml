            - heading "1. สี่พารามิเตอร์ที่ต้องรู้" [level=2] [ref=f1e2069]
          - paragraph [ref=f1e2071]: Frequency คือเลือกว่าจะแตะตรงไหนของสเปกตรัม หน่วยเป็น Hz Gain คือจะบูสต์หรือคัตตรงนั้นกี่ dB Q (หรือ Bandwidth) คือแตะกว้างหรือแคบแค่ไหน ค่า Q สูงแปลว่าแคบเจาะจง ค่า Q ต่ำแปลว่ากว้างนุ่มนวล ส่วน Slope ใช้กับฟิลเตอร์ตัดขอบ บอกว่าจะตัดชันแค่ไหน เช่น 12, 24, 48 dB/oct ยิ่งชันยิ่งตัดสะอาดแต่ยิ่งเสี่ยงเสียงผิดธรรมชาติ
          - paragraph [ref=f1e2073]: หลักการจำง่ายๆ คือ ยิ่งบูสต์แรงยิ่งควรใช้ Q กว้างๆ เพื่อให้เสียงเป็นธรรมชาติ ส่วนการคัตปัญหาเฉพาะจุดเช่นเสียงหอนหรือเสียงจี่ ให้ใช้ Q แคบเพื่อไม่ให้กินเนื้อเสียงดีๆ รอบข้างไปด้วย การขยับ Gain ทีละ 1–2 dB แล้วฟัง มักให้ผลดีกว่าการหมุนทีละ 6 dB ในครั้งเดียว
