              - listitem [ref=f1e5824]: "โทน: low-shelf/high-shelf ±1dB กว้างๆ (เช่น +1dB ที่ 10kHz ให้ air) อย่าบูสต์แคบเกิน Q แคบที่มาสเตอร์เสี่ยง resonance"
