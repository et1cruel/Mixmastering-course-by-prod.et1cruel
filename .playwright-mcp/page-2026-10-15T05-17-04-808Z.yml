        - listitem [ref=e147]: Bell หรือ Peaking ปรับเฉพาะจุดตรงกลางที่เรากำหนด
        - listitem [ref=e148]: Q สูงทำให้จุดแคบและแม่น Q ต่ำทำให้จุดกว้างและนุ่ม
        - listitem [ref=e149]: Subtractive EQ คือตัดความถี่ที่ชนกันก่อนเพิ่มสิ่งที่ต้องการ
