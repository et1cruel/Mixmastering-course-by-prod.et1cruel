        - listitem [ref=e227]: Release คือเวลาที่ Compressor คลายตัวกลับหลังสัญญาณลดลง
        - listitem [ref=e228]: Knee นุ่มทำให้การบีบเริ่มแบบค่อยเป็นค่อยไป
        - listitem [ref=e229]: Makeup gain ชดเชยความดังที่หายไปหลังการบีบ
        - listitem [ref=e230]: Gain reduction คือค่าที่บอกว่า Compressor บีบไปกี่ dB
        - listitem [ref=e231]: Parallel compression คือผสมเสียงที่บีบแรงกลับเข้ากับเสียงต้นฉบับ
        - listitem [ref=e232]: Sidechain ให้เสียงจากแทร็กอื่นมาควบคุม Compressor
        - listitem [ref=e233]: การตั้งค่าทั้งหมดต้องตัดสินด้วยหู ไม่ใช่ค่าบนหน้าจออย่างเดียว
