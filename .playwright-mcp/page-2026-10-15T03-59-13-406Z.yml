          - generic [ref=f1e2974]:
            - heading "ด่านสุดท้ายก่อนเพลงออกสู่โลก" [level=3] [ref=f1e2975]
            - paragraph [ref=f1e2976]: หลัง EQ กับ Compressor จัดระเบียบเพลงแล้ว ยังมีเครื่องมือด่านสุดท้ายที่ตัดสินว่าเพลงจะดังพอ แน่นพอ และสะอาดพอหรือไม่ บทนี้รวม Limiter, Clipper, Saturation, De-esser และ Gate พร้อมสัญญาณเตือนว่าเมื่อไรแปลว่าเรากดหนักเกินไปแล้ว
          - generic [ref=f1e2977]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2978]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2979]:
                - generic [ref=f1e2980]: INPUT ➜ OUTPUT (จำลอง)
              - generic [ref=f1e2985]:
                - generic [ref=f1e2986]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - 'heading "1. Limiter: การ์ดห้ามเสียงแตก" [level=2] [ref=f1e2987]'
          - paragraph [ref=f1e2989]: Limiter คือ Compressor ที่ Ratio สูงมาก (เช่น 10:1 ขึ้นไปจนถึง Infinity) หน้าที่หลักคือกันไม่ให้เสียงเกิน 0 dBFS จนแตก และเพิ่มความดังรวมของเพลง บน Master นิยมตั้ง Ceiling ไว้ที่ -1 dBTP (กันแตกบนสตรีมมิง) แล้วดัน Input ขึ้นจนได้ความดังที่ต้องการ แต่ยิ่งดันมาก เพลงยิ่งแบนและ Transient ยิ่งหาย
          - paragraph [ref=f1e2991]: หลักการตั้ง Limiter ที่ปลอดภัยคือดันทีละน้อยแล้วฟัง Transient กลองว่ายังอยู่หรือไม่ ถ้า Kick เริ่มแป๊ก สแนร์เริ่มแบน แปลว่าดันเกินแล้ว ให้ถอยกลับ สำหรับเพลงส่งอาจารย์ในคลาสนี้ ไม่ต้องไล่ความดังแข่งกับเพลงตลาด ขอแค่ไม่แตกและไดนามิกยังอยู่ก็พอแล้ว ความดังไล่ทันกันได้ตอน Mastering จริง
          - generic [ref=f1e2993]:
            - generic [ref=f1e2994]: ภาพจำลองเพื่อการเรียนรู้ — Fruity Limiter (Master)
            - strong [ref=f1e2995]: 🖥️ Fruity Limiter บน Master
            - paragraph [ref=f1e2996]: เปิด Fruity Limiter ตัวสุดท้ายบน Master ในโหมด Limit ตั้ง Ceiling -1 dB ดูมิเตอร์ Gain Reduction ว่าถูกกดไปกี่ dB ถ้ากดเกิน 2–3 dB ตลอดทั้งเพลงสำหรับการบ้านนี้ ถือว่าหนักไป ให้กลับไปแก้ที่มิกซ์แทนการดัน Limiter ต่อ
          - heading "2. Clipper vs Limiter และ Saturation" [level=2] [ref=f1e2998]
          - paragraph [ref=f1e3000]: Clipper ตัดยอด Peak ทิ้งตรงๆ แทนที่จะกดแบบ Limiter ข้อดีคือได้ความดังเพิ่มโดยจังหวะยังเด้งอยู่ ข้อเสียคือถ้าตัดมากไปเสียงจะแตกหยาบ นิยมใช้กับกลองก่อนเข้า Limiter เพื่อเล็มยอดแหลมออก 1–2 dB แล้ว Limiter จะได้ทำงานน้อยลง ส่วน Saturation คือการเติมฮาร์มอนิกให้เสียงอิ่ม อุ่น และฟังดังขึ้นโดยไม่ต้องดัน Volume
          - paragraph [ref=f1e3002]: Saturation มีหลายรสตั้งแต่ Tape ที่นุ่มอุ่น Tube ที่อิ่มหนา ไปจนถึง Distortion ที่แตกดิบ ใช้ได้ตั้งแต่เบส (เติมฮาร์มอนิกให้ดังในลำโพงเล็ก) เสียงร้อง (เติมเนื้อให้ลอย) ไปจนถึง Drum bus (เติมกาวให้เกาะกัน) หลักคือเริ่มจากน้อยมากๆ แล้วค่อยเพิ่มจนได้ยินความต่าง ถ้าได้ยินว่าแตกชัด แปลว่ามากไปสำหรับงานมิกซ์ทั่วไป
          - generic [ref=f1e3004]:
            - strong [ref=f1e3005]: "🎧 ตัวอย่าง: เบสบางในมือถือ (จุดเริ่มต้นให้ทดลอง)"
            - paragraph [ref=f1e3006]: ถ้าเบสมีแต่ Sub แล้วหายในลำโพงเล็ก ลอง Saturation เบาๆ เพื่อสร้างฮาร์มอนิกย่าน 200–800 Hz เพิ่มขึ้นมา เริ่มจาก Drive ต่ำๆ ผสม 10–20% แล้วฟังในลำโพงมือถือว่าเบสเริ่มได้ยินหรือไม่ เหตุผลที่วิธีนี้ดีกว่าการบูสต์ Sub เพราะลำโพงเล็กปล่อย Sub ไม่ออกตั้งแต่แรก บูสต์ไปก็ไม่ได้ยินอยู่ดี
          - 'heading "3. De-esser และ Gate: ยามเฉพาะกิจ" [level=2] [ref=f1e3008]'
          - paragraph [ref=f1e3010]: De-esser คือ Compressor ที่เฝ้าเฉพาะย่านเสียง S (ราว 5–9 kHz แล้วแต่เสียงคน) คอยกดลงเฉพาะตอนเสียง S โผล่ขึ้นมา ตั้งให้กด 3–6 dB เฉพาะคำที่บาดหูเป็นจุดเริ่มต้นให้ทดลอง ถ้ากดมากไปเสียงร้องจะกลายเป็นเสียงติดอ่าง ส่วน Gate คือประตูที่ปิดเสียงเบากว่า Threshold ทิ้ง ใช้ตัดเสียง bleed เสียงแอร์ หรือเสียงจี่ตอนนักร้องไม่ร้อง
          - paragraph [ref=f1e3012]: Gate ตั้ง Threshold ให้ปิดแค่ช่วงเงียบ ไม่ใช่ตั้งสูงจนตัดหางเสียงร้องไปด้วย Attack เปิดไว Release กลางๆ เพื่อให้ประตูเปิดปิดเนียน ถ้าได้ยินเสียงร้องขาดๆ หายๆ แปลว่า Threshold สูงไปหรือ Release สั้นไป สำหรับงานบ้านทั่วไป ถ้าห้องอัดเงียบอยู่แล้ว อาจไม่ต้องใช้ Gate เลยก็ได้
          - 'heading "Over-compression: สัญญาณเตือนว่าหนักมือไปแล้ว" [level=3] [ref=f1e3014]'
          - generic [ref=f1e3015]:
            - heading "เช็กลิสต์อาการกดหนักเกิน" [level=4] [ref=f1e3016]
            - list [ref=f1e3017]:
              - listitem [ref=f1e3018]: กลองทู่ จังหวะไม่เด้ง ทั้งที่ Volume ดัง
              - listitem [ref=f1e3019]: เสียงร้องแบน ไม่มีเบาดัง ทุกคำดังเท่ากันหมด
              - listitem [ref=f1e3020]: เพลงฟังแล้วเหนื่อย เปิดเบาๆ ก็ยังรู้สึกล้า
              - listitem [ref=f1e3021]: มิเตอร์ Master แดงตลอด Limiter กด 5 dB+ ไม่ยอมปล่อย
              - listitem [ref=f1e3022]: Bypass Compressor ทุกตัวแล้วเพลงหายใจดีขึ้นชัดเจน
          - paragraph [ref=f1e3024]: วิธีแก้ Over-compression ไม่ใช่การถอดทุกอย่างออกในครั้งเดียว แต่ให้ Bypass ทีละตัวแล้วฟังว่าตัวไหนคือผู้ร้าย จากนั้นลด Ratio ยก Threshold หรือยืด Attack กลับมาก่อน ถ้า Limiter บน Master ทำงานหนัก ให้กลับไปลดที่มิกซ์ทีละแทร็กแทน จำไว้ว่าความดังที่ได้จากการบี้จนแบน แพ้ความดังที่ได้จากมิกซ์สมดุลเสมอ
          - generic [ref=f1e3026]:
            - generic [ref=f1e3027]: ภาพจำลองเพื่อการเรียนรู้ — Wave Candy (Master meter)
            - strong [ref=f1e3028]: 🖥️ ตรวจ Over-compression ด้วย Wave Candy
            - paragraph [ref=f1e3029]: เปิด Wave Candy บน Master ดู Waveform ว่ายอดถูกตัดเรียบเป็นก้อนอิฐ (Brickwall) หรือไม่ ดู LUFS/short-term meter ว่าเพลงแน่นตลอดไม่มีหายใจเลยหรือเปล่า ภาพนี้เป็นภาพประกอบ ให้ใช้ดูรูปทรง ไม่ใช่จดตัวเลขในภาพไปใช้
