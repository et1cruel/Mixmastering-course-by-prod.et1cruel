            - paragraph [ref=f1e3033]: Maximus เป็น Multiband ที่กดแยกย่านได้ เหมาะ Glue มาสเตอร์เบาๆ แต่ถ้ากดหนักทุกย่านพร้อมกัน เพลงจะแบนและเฟสเพี้ยนจนแก้ไม่กลับ สำหรับมือใหม่ให้ใช้แค่ Preset เบาๆ แล้วลด Amount ลงครึ่งหนึ่งก่อน ถ้าฟังไม่ออกว่าดีขึ้นให้ Bypass ทิ้ง อย่าฝืนเก็บไว้เพราะเห็นว่ามันเป็นปลั๊กอินเทพ
