            - heading "เดซิเบลมีหลายตระกูล อย่าใช้ปนกัน" [level=2] [ref=f1e846]
          - paragraph [ref=f1e848]: เดซิเบล (dB) เป็นหน่วยอัตราส่วนแบบลอการิทึม ไม่ใช่หน่วยสัมบูรณ์ จึงต้องดูตัวอ้างอิงท้ายชื่อเสมอ dBFS อ้างอิง full scale ดิจิทัล ค่า 0 dBFS คือเพดานสูงสุด เกินคือ clip ทันที ส่วน dB SPL วัดความดังเสียงในอากาศด้วยเครื่องวัด หูฟังกับลำโพงใช้สเกลนี้ และ dBu/dBV เป็นสเกลสาย analog ในฮาร์ดแวร์ การเอาตัวเลขข้ามตระกูลมาเทียบกันโดยตรงจึงผิด
