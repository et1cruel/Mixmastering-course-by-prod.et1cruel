          - generic [ref=f1e897]:
            - strong [ref=f1e898]: ⚠️ ระวัง
            - paragraph [ref=f1e899]: Clipping ดิจิทัลไม่เหมือน saturation ของ analog ที่ยังฟังนุ่มได้ ดิจิทัล clip คือยอดคลื่นถูกตัดแบน เกิด harmonic แข็งๆ ที่หูจับได้ว่าแตกและล้า อย่าแก้ด้วยการลดแค่ master fader เพราะ clip ที่เกิดใน insert หรือ bus แล้วยังฝังอยู่ในเสียง ให้ไล่ gain staging ย้อนกลับไปแก้ที่ต้นเหตุ
