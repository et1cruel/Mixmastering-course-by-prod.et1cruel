          - paragraph [ref=f1e874]: Peak คือค่าสูงสุดชั่วขณะของ waveform ถ้า peak แตะ 0 dBFS คือชนเพดานแล้ว ส่วน RMS (root mean square) คือค่าเฉลี่ยพลังงาน สัมพันธ์กับความรู้สึกว่าดังต่อเนื่องแค่ไหน เพลงที่ peak เท่ากันแต่ RMS สูงกว่าจะฟังดังกว่าเพราะถูกบีบอัดมากกว่า ส่วน LUFS (loudness units relative to full scale) คือมาตรฐานวัด loudness ที่ถ่วงน้ำหนักตามหูมนุษย์ (K-weighting) พร้อมวัด momentary, short-term และ integrated ใช้เป็นภาษากลางของแพลตฟอร์มสตรีมมิง
          - generic [ref=f1e875]:
            - heading [level=4]
            - list [ref=f1e876]:
              - listitem [ref=f1e877]: Peak + True Peak — เฝ้าระวัง clipping, true peak จับ inter-sample peak ที่ DAC สร้างขึ้น
              - listitem [ref=f1e878]: RMS / Crest factor — บอกความห่าง peak กับค่าเฉลี่ย ยิ่งห่างยิ่ง dynamic
              - listitem [ref=f1e879]: LUFS integrated — ตัวเลข loudness รวมทั้งเพลง แพลตฟอร์มใช้ normalize
          - paragraph [ref=f1e881]: Headroom คือที่ว่างระหว่าง peak สูงสุดกับ 0 dBFS เป้าหมาย mix ให้ peak รวมที่ master bus อยู่ราว −6 dBFS (จุดเริ่มต้น) เพื่อเหลือที่ให้ mastering ใส่ EQ, compression และ limiter ได้โดยไม่ชนเพดาน ตัวเลขนี้ไม่ใช่กฎตายตัวแต่เป็นจุดเริ่มต้นปลอดภัยสำหรับมือใหม่ ส่วน true peak ควรคุมให้ต่ำกว่า −1 dBTP (จุดเริ่มต้น) ตอน export เพื่อเผื่อการแปลง codec ของสตรีมมิง
          - generic [ref=f1e883]:
            - strong [ref=f1e884]: "🔁 ก่อน–หลัง: mix ชนเพดาน vs เผื่อ headroom"
            - paragraph [ref=f1e885]: "ก่อน: ทุกแทร็กดัน fader จน master peak ชน 0 dBFS ใส่ limiter กด 6 dB ตั้งแต่ตอน mix ผลคือเสียงอั้น กลองไม่กระแทก และ mastering ขยับอะไรไม่ได้ หลัง: ลดทุกแทร็กลงให้ master peak ราว −6 dBFS (จุดเริ่มต้น) เสียงเปิด กลองมี punch และ mastering มีที่ว่างให้ยก loudness อย่างสะอาด ความดังสุดท้ายไปทำตอน master ไม่ใช่ตอน mix"
