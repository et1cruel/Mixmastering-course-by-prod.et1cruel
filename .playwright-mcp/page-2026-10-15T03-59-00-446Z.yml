            - paragraph [ref=f1e904]: ใน FL Studio 25 ดู peak meter บน Mixer ถ้าไฟยอดเป็นสีแดงคือ clip แล้ว คลิกที่ตัวเลข peak เพื่อรีเซ็ตแล้วเล่นท่อนดังสุดดูใหม่ ใช้ Wave Candy ในโหมด Meter เพิ่มเพื่อดู RMS ควบคู่กัน กฎฝึกคือถ้า master แตะ 0 ให้ลด fader ทุกแทร็กลงพร้อมกัน ไม่ใช่ดึง master fader ลงอย่างเดียว
