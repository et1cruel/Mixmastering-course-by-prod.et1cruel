                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - heading "1. Hz คืออะไร และหูคนได้ยินช่วงไหน" [level=2] [ref=f1e1884]
          - paragraph [ref=f1e1886]: Hz (Hertz) คือจำนวนรอบการสั่นของคลื่นเสียงต่อวินาที ยิ่งสั่นถี่ เสียงยิ่งสูง เช่น สายกีตาร์โปร่งสั่นช้าให้เสียงทุ้ม ส่วนฉาบสั่นเร็วมากจนได้เสียงแหลม หูของมนุษย์โดยทั่วไปรับได้ราว 20 Hz ถึง 20,000 Hz แต่หูแต่ละคนและลำโพงแต่ละคู่ได้ยินไม่เท่ากัน ยิ่งอายุมากขึ้นยิ่งได้ยินเสียงแหลมสูงๆ น้อยลง
          - paragraph [ref=f1e1888]: ในงานมิกซ์เราจึงแบ่งสเปกตรัมเป็นช่วงๆ เพื่อคุยกันรู้เรื่อง เช่น Sub (20–60 Hz) คือแรงสั่นสะเทือนมากกว่าจะเป็นโน้ต Low (60–250 Hz) คือความอิ่มหนาของ Kick และเบส Mid (250 Hz–4 kHz) คือเนื้อเสียงร้องและกีตาร์ High (4–20 kHz) คือความใสและอากาศ การเรียกชื่อย่านให้ตรงกันช่วยให้สื่อสารกับนักดนตรีและลูกค้าได้เร็วขึ้นมาก
