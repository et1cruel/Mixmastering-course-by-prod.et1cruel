          - 'heading "2. Fundamental vs Harmonics: ทำไมเปียโนกับกีตาร์เล่นโน้ตเดียวกันแต่เสียงไม่เหมือนกัน" [level=2] [ref=f1e1919]'
          - paragraph [ref=f1e1921]: ทุกโน้ตดนตรีมี Fundamental คือความถี่หลักที่บอกว่าเป็นโน้ตอะไร เช่น A4 = 440 Hz แต่เสียงเครื่องดนตรีจริงยังมี Harmonics ซึ่งเป็นความถี่ทวีคูณ (880, 1320, 1760 Hz …) ซ้อนอยู่ด้วย สัดส่วนความดังของฮาร์มอนิกแต่ละตัวนี่เองที่ทำให้เราฟังออกว่านี่คือเปียโนหรือกีตาร์ ทั้งที่กดโน้ตเดียวกัน
          - paragraph [ref=f1e1923]: ลองนึกภาพ Fundamental เป็นเสาหลักของตึก ส่วน Harmonics เป็นชั้นต่างๆ ที่ตกแต่งตึกนั้น ถ้า EQ ไปกด Fundamental เสียงจะเปลี่ยนโน้ตหรือหายไปเลย แต่ถ้าไปแต่ง Harmonics เสียงจะเปลี่ยนคาแรกเตอร์ เช่น กดฮาร์มอนิกแหลมๆ เสียงจะนุ่มลงโดยโน้ตยังอยู่ครบ นี่คือเหตุผลว่าทำไมการบูสต์แหลมเสียงร้องจึงทำให้รู้สึกชัดขึ้นโดยไม่ต้องร้องใหม่
          - generic [ref=f1e1925]:
            - strong [ref=f1e1926]: "🎧 ตัวอย่าง: เสียงเบสโน้ต A1"
            - paragraph [ref=f1e1927]: เบสเล่นโน้ต A1 มี Fundamental ที่ 55 Hz แต่สิ่งที่หูเราใช้จำว่าเป็นเบสตัวนี้มักอยู่ที่ฮาร์มอนิก 110, 220, 440 Hz ด้วย ถ้าฟังในลำโพงมือถือที่ปล่อย 55 Hz ไม่ออก เรายังได้ยินฮาร์มอนิกบนๆ จึงพอรู้ว่าเป็นโน้ตอะไร นี่คือหลักการเดียวกับที่ปลั๊กอินเพิ่มฮาร์มอนิกเบสช่วยให้เบสดังในลำโพงเล็กได้โดยไม่ต้องบูสต์ Sub
          - generic [ref=f1e1929]:
            - generic [ref=f1e1930]: ภาพจำลองเพื่อการเรียนรู้ — Wave Candy + Parametric EQ 2
