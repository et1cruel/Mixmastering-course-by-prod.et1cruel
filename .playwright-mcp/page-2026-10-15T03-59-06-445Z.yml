          - generic [ref=f1e1871]:
            - heading "ทำไมต้องเข้าใจความถี่ก่อนจับ EQ" [level=3] [ref=f1e1872]
            - paragraph [ref=f1e1873]: EQ ไม่ใช่ปุ่มวิเศษที่ทำให้เสียงดีขึ้นเอง แต่คือเครื่องมือจัดสรรพื้นที่ความถี่ให้แต่ละเครื่องดนตรีอยู่ร่วมกันได้ บทนี้จะปูพื้นฐานว่าเสียงที่เราได้ยินประกอบด้วยอะไรบ้าง และทำไมเครื่องดนตรีสองชิ้นจึงตีกันทั้งที่โน้ตคนละตัวกัน
