          - paragraph [ref=f1e4648]: "กฎทอง: ถ้าร้องไม่ชัด ให้ลอง cut กีตาร์/คีย์บอร์ดช่วง 2-4kHz ลง 2-3dB ก่อน boost ร้อง การ cut ให้ที่ว่างโดยไม่เพิ่มความดังรวมและไม่เพิ่มความบาด ส่วนการ boost ทุกครั้งต้องลด output ชดเชยและเทียบดังเท่าเดิม ไม่งั้นหูจะหลอกว่าดังกว่าคือดีกว่า"
