          - 'heading "Dither: เรื่องเล็กที่ต้องรู้" [level=2] [ref=f1e6503]'
          - paragraph [ref=f1e6505]: "Dither คือ noise เบามากที่เติมตอนลด bit depth (เช่น 24-bit → 16-bit CD) เพื่อกัน quantization distortion ขั้นบันได กฎง่ายๆ: ลด bit depth ครั้งเดียวตอนสุดท้าย + dither ครั้งเดียว ถ้าส่ง 24-bit ขึ้นไปไม่ต้อง dither ถ้า bounce ภายใน 32-bit float ไม่ต้อง dither"
