          - generic [ref=e177]:
            - heading "ทำไมแต่ละเสียงดี แต่รวมกันแล้วมั่ว" [level=3] [ref=e178]
            - paragraph [ref=e179]: ปัญหาคลาสสิกของมือใหม่คือ Solo ฟังดีทุกแทร็ก แต่พอเปิดรวมกันกลับอู้อี้ไม่ชัด สาเหตุหลักคือ Masking คือเสียงที่ดังกว่าในย่านเดียวกันบดบังเสียงที่เบากว่า บทนี้จะสอนวิธีหาจุดทับซ้อนและแก้ด้วย EQ แบบมืออาชีพ
          - generic [ref=e180]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=e181]:
