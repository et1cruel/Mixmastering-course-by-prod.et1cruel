            - paragraph [ref=e235]: หูคนมักหลงคิดว่าเสียงที่ดังกว่าคือเสียงที่ดีกว่า ดังนั้นหลังบูสต์ EQ ใดๆ ให้ปรับ Output Gain ลงมาให้ดังเท่าเดิมก่อนเทียบก่อน-หลัง ถ้าเสียงยังดีกว่าจริงค่อยเก็บไว้ การคัตก่อนบูสต์ยังช่วยรักษา Headroom ทำให้ Master ไม่ต้องทำงานหนักโดยไม่จำเป็น
          - generic [ref=e237]:
            - strong [ref=e238]: "✏️ ลองทำ: ช่วยเสียงร้องโดยไม่แตะเสียงร้อง"
            - paragraph [ref=e239]: Loop ท่อนฮุกที่มีร้องกับดนตรีครบ เปิด EQ บนกีตาร์/คีย์บอร์ด ลองคัตลง 2 dB แบบ Q กว้างแถว 2–4 kHz แล้วฟังว่าเสียงร้องชัดขึ้นหรือไม่ จากนั้น Bypass เทียบแบบปรับความดังให้เท่าเดิม ถ้าชัดขึ้นโดยดนตรีไม่เสีย แปลว่าสำเร็จ
