              - listitem [ref=e230]: "เคลียร์พื้นที่ให้พระเอก: คัตเครื่องดนตรีประกอบตรงย่านที่ Kick/เบส/ร้องเด่น แทนการบูสต์พระเอก"
              - listitem [ref=e231]: "บูสต์ทีหลังและน้อยๆ: ถ้ายังต้องการคาแรกเตอร์ ค่อยบูสต์กว้างๆ 1–2 dB แล้ว Gain-match ก่อนตัดสิน"
          - generic [ref=e233]:
