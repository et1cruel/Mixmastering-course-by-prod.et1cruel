            - heading "ทำไมแต่ละเสียงดี แต่รวมกันแล้วมั่ว" [level=3] [ref=f1e2222]
            - paragraph [ref=f1e2223]: ปัญหาคลาสสิกของมือใหม่คือ Solo ฟังดีทุกแทร็ก แต่พอเปิดรวมกันกลับอู้อี้ไม่ชัด สาเหตุหลักคือ Masking คือเสียงที่ดังกว่าในย่านเดียวกันบดบังเสียงที่เบากว่า บทนี้จะสอนวิธีหาจุดทับซ้อนและแก้ด้วย EQ แบบมืออาชีพ
          - generic [ref=f1e2224]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2225]:
