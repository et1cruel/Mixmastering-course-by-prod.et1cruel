            - paragraph [ref=f1e2279]: หูคนมักหลงคิดว่าเสียงที่ดังกว่าคือเสียงที่ดีกว่า ดังนั้นหลังบูสต์ EQ ใดๆ ให้ปรับ Output Gain ลงมาให้ดังเท่าเดิมก่อนเทียบก่อน-หลัง ถ้าเสียงยังดีกว่าจริงค่อยเก็บไว้ การคัตก่อนบูสต์ยังช่วยรักษา Headroom ทำให้ Master ไม่ต้องทำงานหนักโดยไม่จำเป็น
          - generic [ref=f1e2281]:
