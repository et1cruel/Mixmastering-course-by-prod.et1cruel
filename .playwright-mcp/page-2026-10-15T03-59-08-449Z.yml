                - generic [ref=f1e2227]: EQ CURVE (จำลอง)
              - generic [ref=f1e2232]:
                - generic [ref=f1e2233]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - heading "1. Masking คืออะไร" [level=2] [ref=f1e2234]
          - paragraph [ref=f1e2236]: หูของคนไม่ได้ยินทุกเสียงแยกกันสมบูรณ์ ถ้ามีสองเสียงพลังงานหนาแน่นในย่านเดียวกัน เสียงที่ดังกว่าจะกลบเสียงที่เบากว่า เช่น กีตาร์แตกหนาๆ กลบเสียงร้อง หรือเบสกลบ Kick จนจังหวะหาย Masking เกิดมากเป็นพิเศษในย่าน Low (Kick vs Bass) และย่าน Mid (Vocal vs Guitar/Synth/Snare) เพราะเป็นย่านที่เครื่องดนตรีหลายชิ้นอยู่ร่วมกัน
          - paragraph [ref=f1e2238]: วิธีสังเกต Masking คือเสียงหายหรือไม่ชัดเฉพาะตอนเล่นพร้อมกัน แต่พอ Mute อีกชิ้นกลับชัดขึ้นมา อย่าเพิ่งแก้ด้วยการบูสต์เสียงที่หายให้ดังขึ้น เพราะจะยิ่งทำให้มิกซ์แน่นและล้า วิธีที่ยั่งยืนกว่าคือลดย่านที่ทับกันของเสียงที่ไม่จำเป็นต้องอยู่ตรงนั้น หรือจัด Arrangement ให้เล่นคนละ Octave กัน
          - generic [ref=f1e2239]:
            - figure "ภาพจำลองเพื่อการเรียนรู้ แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2240]:
              - img "แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้" [ref=f1e2241]:
                - generic [ref=f1e2242]: EQ CURVE (จำลอง)
              - generic [ref=f1e2247]:
                - generic [ref=f1e2248]: ภาพจำลองเพื่อการเรียนรู้
                - text: แผนภาพประกอบบท — ภาพจำลองเพื่อการเรียนรู้
            - 'heading "2. สมรภูมิหลัก: Kick vs Bass" [level=2] [ref=f1e2249]'
          - paragraph [ref=f1e2251]: Kick กับเบสแชร์พื้นที่ 30–120 Hz ด้วยกันทั้งคู่ ถ้าต่างฝ่ายต่างบวม มิกซ์จะอู้และ Master จะโดน Limiter กดจนเพลงเต้นไม่ออก หลักคิดคือต้องตกลงกันว่าใครเป็นพระเอกย่านไหน เช่น Kick ใหญ่ที่ Sub (50–60 Hz) เบสก็หลบไปเด่นที่ Punch (80–120 Hz) หรือกลับกันก็ได้ ขึ้นกับสไตล์เพลง ไม่มีสูตรตายตัว
          - generic [ref=f1e2253]:
            - strong [ref=f1e2254]: 🎧 ตัวอย่างการแบ่งงาน (จุดเริ่มต้นให้ทดลอง)
            - paragraph [ref=f1e2255]: แนวทางที่หนึ่งคือให้ Kick มี Click ชัดที่ 2–5 kHz ส่วนเบสมีเนื้อที่ 200–500 Hz ทั้งคู่จะแยกกันชัดโดยไม่ต้องตัด Sub โหดๆ อีกแนวทางคือใช้ Sidechain ให้เบสหลบ Kick อัตโนมัติ (เรียนละเอียด Day 4) เหตุผลที่ต้องทดลองทั้งสองแบบเพราะ 808 บางลูกมี Click ในตัวอยู่แล้ว การบูสต์ Click Kick เพิ่มอาจทำให้แหลมเกินโดยไม่จำเป็น
          - generic [ref=f1e2257]:
            - generic [ref=f1e2258]: ภาพจำลองเพื่อการเรียนรู้ — Fruity Parametric EQ 2 (Kick vs Bass)
            - strong [ref=f1e2259]: 🖥️ ดูการทับกันด้วย Parametric EQ 2
            - paragraph [ref=f1e2260]: เปิด Parametric EQ 2 บน Kick และเบสพร้อมกัน ดูสเปกตรัมพื้นหลังว่าโคกพลังงานทับกันตรงไหน ลองคัตเบสลง 2–3 dB ตรงจุดที่ Kick เด่นที่สุด แล้วฟังว่าจังหวะชัดขึ้นหรือไม่ ภาพนี้เป็นภาพประกอบการเรียนรู้ ให้โฟกัสที่วิธีดู ไม่ใช่ตัวเลขในภาพ
          - heading "3. เสียงร้อง vs เครื่องดนตรีอื่น" [level=2] [ref=f1e2262]
          - paragraph [ref=f1e2264]: เสียงร้องคือพระเอกของเกือบทุกเพลง ศัตรูของมันคือทุกอย่างที่มีพลังงานในย่าน 1–5 kHz ทั้งกีตาร์ คีย์บอร์ด และสแนร์ เทคนิคที่ใช้กันคือคัตเครื่องดนตรีอื่นลง 1–3 dB แบบ Q กว้างตรงย่านที่เสียงร้องเด่น แทนที่จะบูสต์เสียงร้องขึ้นไปแข่ง วิธีนี้ทำให้เสียงร้องลอยออกมาเองโดยมิกซ์รวมไม่ดังขึ้นและไม่บาดหู
          - paragraph [ref=f1e2266]: อีกจุดที่ต้องระวังคือ Low-Mid 200–500 Hz ที่มักสะสมจากหลายแทร็กจนเสียงร้องทึบ การคัตย่านนี้บนกีตาร์หรือคีย์บอร์ดลงเล็กน้อยมักทำให้เสียงร้องชัดขึ้นโดยไม่ต้องแตะเสียงร้องเลย จำไว้ว่า EQ เครื่องดนตรีประกอบเพื่อให้เสียงร้องดีขึ้นได้ โดยไม่ต้อง EQ เสียงร้องเพิ่ม
          - heading "เวิร์กโฟลว์ Subtractive EQ ทีละขั้น" [level=3] [ref=f1e2268]
          - generic [ref=f1e2269]:
