              - listitem [ref=f1e2275]: "บูสต์ทีหลังและน้อยๆ: ถ้ายังต้องการคาแรกเตอร์ ค่อยบูสต์กว้างๆ 1–2 dB แล้ว Gain-match ก่อนตัดสิน"
